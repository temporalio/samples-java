rootProject.name = 'temporal-java-samples'

include 'core'
include 'springai:basic'
include 'springai:mcp'
include 'springai:multimodel'
include 'springai:rag'
include 'springboot'
include 'springboot-basic'
include 'lambda-worker:starter'
include 'lambda-worker:worker'
include 'cloud-run-worker'

// The cloud-run-worker sample depends on io.temporal:temporal-gcp-cloud-run, which is not yet
// released. Pass -PtemporalSdkPath=/path/to/sdk-java to resolve it (and the other temporal-*
// modules) against a local SDK checkout through Gradle composite-build dependency substitution.
def temporalSdkPath = gradle.startParameter.projectProperties['temporalSdkPath']
if (temporalSdkPath) {
    includeBuild temporalSdkPath
}
