apply plugin: 'application'

dependencies {
    // The GCP Cloud Run modules first shipped in 1.40.0; pin the io.temporal deps to that
    // released version here rather than bumping the repo-wide javaSDKVersion. The explicit
    // temporal-sdk dep is required because temporal-gcp-cloud-run-id declares it as compileOnly.
    implementation "io.temporal:temporal-sdk:1.40.0"
    implementation "io.temporal:temporal-envconfig:1.40.0"
    implementation "io.temporal:temporal-gcp-cloud-run-opentelemetry:1.40.0"
    implementation "io.temporal:temporal-gcp-cloud-run-id:1.40.0"
    runtimeOnly group: 'ch.qos.logback', name: 'logback-classic', version: '1.5.6'

    testImplementation "io.temporal:temporal-testing:$javaSDKVersion"
    testImplementation "junit:junit:4.13.2"
    testImplementation(platform("org.junit:junit-bom:5.10.3"))
    testRuntimeOnly "org.junit.vintage:junit-vintage-engine"

    dependencies {
        errorproneJavac('com.google.errorprone:javac:9+181-r4173-1')
        errorprone('com.google.errorprone:error_prone_core:2.28.0')
    }
}

application {
    mainClass = 'io.temporal.samples.gcp.cloudrun.CloudRunWorker'
    // Stable launcher name the Dockerfile relies on, independent of the Gradle project path.
    applicationName = 'cloud-run-worker'
}
